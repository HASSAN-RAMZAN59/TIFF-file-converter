buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 37
        targetSdkVersion = 37
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.8.20"
        webkit_version = "1.4.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "11"
        }
    }

    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                buildFeatures {
                    buildConfig = true
                }
            }
            if (project.android.namespace == null) {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
                    def builder = factory.newDocumentBuilder()
                    def document = builder.parse(manifestFile)
                    project.android.namespace = document.getDocumentElement().getAttribute("package")
                }
            }
        }
    }
}
