buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 21
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
